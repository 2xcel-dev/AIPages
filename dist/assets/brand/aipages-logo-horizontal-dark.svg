<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <!-- AIPages.tech — Primary Horizontal Lockup (Dark Background) -->
  <g transform="translate(20, 26)">
    <!-- Terminal Window Mark -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="94" height="88" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2" />
      
      <!-- Window Controls -->
      <circle cx="18" cy="18" r="3.5" fill="#EF4444" />
      <circle cx="30" cy="18" r="3.5" fill="#FFD000" />
      <circle cx="42" cy="18" r="3.5" fill="#10B981" />

      <!-- Command Prompt '>' in Cyber Yellow -->
      <path d="M 20 42 L 34 52 L 20 62" fill="none" stroke="#FFD000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Glowing Agent Cursor Block -->
      <rect x="42" y="44" width="14" height="16" rx="2" fill="#FFD000" />
      
      <!-- Data Traces -->
      <line x1="62" y1="52" x2="74" y2="52" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
      <line x1="20" y1="74" x2="65" y2="74" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Typography -->
    <g transform="translate(125, 20)">
      <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5">
        <tspan fill="#FFFFFF">AIPages</tspan><tspan fill="#FFD000">.</tspan><tspan fill="#94A3B8" font-size="44" font-weight="700">tech</tspan>
      </text>

      <!-- Architectural Divider -->
      <line x1="385" y1="12" x2="385" y2="72" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />

      <!-- Subtitles -->
      <g transform="translate(415, 20)">
        <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="7" fill="#F8FAFC">THE AI AGENT DIRECTORY</text>
        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#94A3B8">INDEX / TOOLS / PROMPTS / RUNTIMES</text>
      </g>
    </g>
  </g>
</svg>
