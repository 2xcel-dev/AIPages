<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151E32"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="640" cy="220" r="280" fill="#3B82F6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="640" cy="180" r="140" fill="#F59E0B" opacity="0.05" filter="url(#glow)"/>

  <!-- Central Brand Container -->
  <g transform="translate(640, 290)">
    
    <!-- Terminal Icon Lockup -->
    <g transform="translate(0, -165)">
      <!-- Terminal Window Box -->
      <rect x="-65" y="-60" width="130" height="110" rx="22" ry="22" fill="url(#cardGrad)" stroke="#334155" stroke-width="2.5" filter="url(#glow)"/>
      
      <!-- Window Control Dots -->
      <circle cx="-38" cy="-36" r="5" fill="#EF4444"/>
      <circle cx="-22" cy="-36" r="5" fill="#EAB308"/>
      <circle cx="-6" cy="-36" r="5" fill="#10B981"/>

      <!-- Terminal Command Line Prompt -->
      <path d="M -36 -6 L -20 6 L -36 18" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Cursor Block -->
      <rect x="-10" y="-3" width="18" height="18" rx="3" fill="#FBBF24"/>
      
      <!-- Sub-line in terminal -->
      <line x1="16" y1="6" x2="36" y2="6" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- AIPages .tech Wordmark -->
    <g transform="translate(0, 10)">
      <text x="-48" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="74" fill="url(#textGrad)" letter-spacing="-1.5">
        AIPages
      </text>
      
      <!-- .tech accent badge -->
      <g transform="translate(132, -22)">
        <rect x="0" y="-34" width="14" height="14" rx="2.5" fill="#EAB308"/>
        <text x="22" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="52" fill="#94A3B8" letter-spacing="-0.5">
          .tech
        </text>
      </g>
    </g>

    <!-- Tagline: THE AI AGENT DIRECTORY -->
    <text x="0" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="19" fill="#94A3B8" letter-spacing="9">
      THE AI AGENT DIRECTORY
    </text>

    <!-- Horizontal Divider -->
    <line x1="-360" y1="95" x2="360" y2="95" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Subtitle: INDEX / TOOLS / PROMPTS / RUNTIMES -->
    <text x="0" y="132" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-weight="600" font-size="14" fill="#64748B" letter-spacing="5">
      INDEX   /   TOOLS   /   PROMPTS   /   RUNTIMES
    </text>

    <!-- Capability Feature Badges -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: Vector Search Index -->
      <g transform="translate(-240, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">
          3072-dim Vector Search
        </text>
      </g>

      <!-- Badge 2: MCP & OpenAPI Gateway -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#FBBF24">
          MCP &amp; OpenAPI Registry
        </text>
      </g>

      <!-- Badge 3: Base L2 x402 Settlement -->
      <g transform="translate(240, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" fill="#38BDF8">
          Base L2 x402 Micropayments
        </text>
      </g>
    </g>

  </g>
</svg>
